name: CI

# This repository's own gate. It runs on GitHub-hosted runners deliberately:
# gating the ephemeral-runner mechanism on the ephemeral runner it provides
# means a change that breaks provisioning can never be tested, because the
# thing under test is also the thing that would have to work to test it.
#
# These three suites used to live in deckdumpster and one of them ran as a gate
# inside deploy/ci.sh, so the mechanism's tests only ever ran when that one
# repository's CI ran. Here they gate the mechanism itself, which is the only
# place they were ever about.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every six hours. A broken main is visible on its own without waiting
    # for a PR to land against it.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Script modes, gate scripts present, shellcheck and the composite-action
      # parses are one script, so `work checks` and CI run the same thing
      # (sp-4rim2v). The shellcheck exclusions are named in the script.
      - name: static checks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash scripts/ci-static.sh --full

      - name: provision
        run: bash scripts/test-provision.sh

      - name: teardown
        run: bash scripts/test-teardown.sh

      - name: reap
        run: bash scripts/test-reap.sh

      - name: deregister runner
        run: bash scripts/test-deregister-runner.sh

      # The substrate list is mostly DATA -- a set of package names and machine
      # properties -- and data has no behaviour to observe, so this suite asserts
      # the content of the list and that --check mutates nothing. It matters
      # because a missing entry does not fail here; it fails in a consumer's run,
      # on a VM that is destroyed forty seconds later.
      - name: warm cache
        run: bash scripts/test-warm-cache.sh

      - name: template substrate
        run: bash scripts/test-template-substrate.sh

      # Static contract check: every _require_env var in teardown.sh is wired
      # through the teardown action, and provision declares vm-token as an output.
      # This is what would have caught the db-rzdr regression before it shipped.
      - name: action contract
        run: bash scripts/test-actions.sh

      # Consumer-input check: verify that a workflow calling the action passes
      # all inputs declared required: true. A composite action does not enforce
      # required — GitHub silently supplies nothing when a caller omits an input.
      # This is what would have caught sp-q1sp3: teardown declared template-vmid
      # required but nothing compared the action file to the consumer workflows.
      - name: consumer action inputs
        run: bash scripts/test-action-inputs.sh

      # Advance-v1 input-diff check: verifies that check-advance-inputs.sh
      # refuses a candidate that adds a new required input without a default,
      # and passes candidates that add only optional or defaulted inputs.
      - name: advance-v1 input diff
        run: bash scripts/test-advance-inputs.sh

      # The advance job's checkout must not persist GITHUB_TOKEN, or the tag
      # push authenticates as the GitHub App instead of V1_TAG_PAT (sp-ku3ugt).
      - name: advance-v1 credentials
        run: bash scripts/test-advance-credentials.sh

      # A hand dispatch offers only v2 and defaults to it (sp-burbrw).
      - name: advance-v1 tag input
        run: bash scripts/test-advance-tag-input.sh

      # Advance refuses a ref whose AMI-input hash has no probe-passed AMI.
      - name: advance-v1 AMI gate
        run: bash scripts/test-check-ami-for-ref.sh

      # ami-build offline section: stubs ssm get-parameters-by-path to verify
      # that ami-build.sh reads the /ephemeral-ci/spill/ parameters correctly
      # and fails with a clear message when they are unreadable or absent.
      # No AWS credentials are needed; online tests skip gracefully without them.
      - name: ami-build spill parameters
        run: bash scripts/test-ami-build.sh

      # The other spill readers (ec2-diag, check-spill-permissions, test-reap)
      # resolve their ids from the same parameters; none calls describe-stacks.
      - name: spill parameters readers
        run: bash scripts/test-spill-params.sh

      - name: spill probe workflow
        run: bash scripts/test-spill-probe.sh

      - name: spill probe first-test helper
        run: bash scripts/test-spill-probe-first-test.sh

      - name: tailnet helpers
        run: bash scripts/test-tailnet.sh

      - name: workflow script paths exist
        run: bash scripts/test-workflow-paths.sh

      # Rust suites (tests/*.rs): the reap suite against a stubbed curl (age and
      # enumeration paths; the bash suite covers the busy check and the
      # VM-to-runner correlation), and the guard that no *.py is tracked.
      - name: rust tests
        run: cargo test --locked

  # Infrastructure is Terraform (law-infrastructure-is-terraform); the one CDK
  # stack left is TerraformBootstrap. Offline only: no credentials, the AWS
  # provider is mocked in `terraform test`.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: terraform validate and test (spill, backup)
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform test

      - name: terraform validate and test (bootstrap-identity)
        run: |
          terraform -chdir=infra/terraform/bootstrap-identity init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap-identity validate
          terraform -chdir=infra/terraform/bootstrap-identity test

      - name: terraform validate and test (github)
        run: |
          terraform -chdir=infra/terraform/github init -backend=false -input=false
          terraform -chdir=infra/terraform/github validate
          terraform -chdir=infra/terraform/github test

      - name: TerraformBootstrap stack tests
        working-directory: infra
        run: |
          npm ci
          npm test

  # Only runs when `test` fails on a pull request. Checks whether the base
  # branch's most recent CI run is also failing, which would mean the red is
  # inherited from the base rather than introduced by this PR. A failing
  # base-check with the annotation "Base is red" is the signal; a passing
  # base-check with "Base is green" confirms the PR itself is the cause.
  base-check:
    if: always() && github.event_name == 'pull_request' && needs.test.result == 'failure'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Report if base is also red
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_ref="${{ github.base_ref }}"
          base_conclusion=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch "$base_ref" \
            --workflow ci.yml \
            --status completed \
            --limit 1 \
            --json conclusion \
            -q '.[0].conclusion // empty' 2>/dev/null || true)
          if [ -z "$base_conclusion" ]; then
            echo "No completed CI run found for $base_ref; cannot determine base state."
          elif [ "$base_conclusion" = "success" ]; then
            echo "Base ($base_ref) is green — this PR introduced the failure."
          else
            echo "::error title=Base is red::$base_ref last completed CI run: $base_conclusion. This PR's test failure may be inherited from the base branch, not introduced here."
            exit 1
          fi
