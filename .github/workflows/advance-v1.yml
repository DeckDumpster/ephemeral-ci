name: Advance v1

# Moves the v1 tag to the most recent commit on main whose CI concluded
# "success". Consumers pin @v1; this is the documented path for landing
# a batch of changes onto them.
#
# CI must be running on push to main (ci.yml's push trigger) for this to
# find green commits reliably. For commits that predate that trigger,
# manually dispatch ci.yml on main first, wait for it to pass, then run
# this workflow.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the target commit but do not move the tag.
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest green commit on main
        id: find-green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          found=""
          while IFS= read -r sha; do
            conclusion=$(gh run list \
              --repo "${{ github.repository }}" \
              --commit "$sha" \
              --workflow ci.yml \
              --status completed \
              --limit 1 \
              --json conclusion \
              -q '.[0].conclusion // empty' 2>/dev/null || true)
            if [ "$conclusion" = "success" ]; then
              found="$sha"
              break
            fi
          done < <(git log --format='%H' origin/main | head -50)
          if [ -z "$found" ]; then
            echo "::error::No green CI run found in the last 50 commits on main. Trigger ci.yml via workflow_dispatch on main and wait for it to pass, then re-run this workflow."
            exit 1
          fi
          echo "target=$found" >> "$GITHUB_OUTPUT"
          echo "Latest green commit on main:"
          git log --oneline -1 "$found"

      - name: Show current v1 and target
        run: |
          current=$(git rev-parse refs/tags/v1 2>/dev/null || echo "(not set)")
          target="${{ steps.find-green.outputs.target }}"
          echo "Current v1 : $current"
          echo "Target     : $target"
          if [ "$current" = "$target" ]; then
            echo "v1 is already at the latest green commit. Nothing to do."
          fi

      - name: Check for action interface changes since v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="${{ steps.find-green.outputs.target }}"
          if ! git rev-parse --verify refs/tags/v1 >/dev/null 2>&1; then
            echo "No v1 tag yet — skipping interface check."
            exit 0
          fi
          # Detect additions or removals in the inputs: or outputs: sections of
          # either action file. A line changed under those sections means the
          # public contract shifted and consumers must update before this advance
          # is safe. Cut a new major version (v2) instead.
          #
          # Pattern: any added/removed line that is either the inputs:/outputs:
          # top-level key itself, or a 2-space-indented first-level YAML entry
          # (the input/output names and their direct properties).
          if git diff "refs/tags/v1" "$target" -- \
               provision/action.yml teardown/action.yml \
             | grep -E '^[+-][^+-]' \
             | grep -qE '^[+-](inputs:|outputs:|  [a-z][a-z0-9-]*:)'; then
            echo "::error::This commit changes action inputs or outputs in provision/action.yml or teardown/action.yml relative to v1."
            echo "::error::Advancing v1 will silently break consumers that have not updated their workflows to pass or receive the changed fields."
            echo "::error::Either cut a new major version (v2) and coordinate the consumer updates, or verify that all consumers (deckdumpster, pokedumpster) have already been updated."
            exit 1
          fi
          echo "No action interface changes since v1."

      - name: Advance v1 tag
        if: inputs.dry-run == false
        run: |
          target="${{ steps.find-green.outputs.target }}"
          git tag -f v1 "$target"
          git push origin v1 --force
          echo "::notice::v1 advanced to $target"
