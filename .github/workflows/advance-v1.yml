name: Advance v1

# Moves a major tag (v1 by default; the `tag` input selects v2) to the most
# recent commit on main whose CI concluded "success". Consumers pin @v1 or @v2; this is the documented path for landing
# a batch of changes onto them.
#
# Before moving the tag, three checks must pass:
#   1. Probe: provision and teardown a real VM at the candidate SHA. A
#      candidate whose provision.sh refuses the template, or whose teardown
#      fails, cannot be v1 — consumers would break immediately.
#   2. Spill AMI: an AMI tagged with the target's AMI-input hash exists and
#      passed the spill probe (scripts/check-ami-for-ref.sh).
#   3. Interface diff: a removed input/output, a newly required input or a
#      changed default in provision or teardown breaks consumers and refuses
#      without consumers-updated. A new optional input with a default, or a new
#      output, cannot break anyone: it passes with a note in the run summary.
#
# CI must be running on push to main (ci.yml's push trigger) for this to
# find green commits reliably. For commits that predate that trigger,
# manually dispatch ci.yml on main first, wait for it to pass, then run
# this workflow.
#
# Secrets required:
#   V1_TAG_PAT — a Personal Access Token with 'workflow' and 'repo' scopes.
#                GITHUB_TOKEN cannot push a tag that moves across a workflow
#                file change (GitHub App restriction). This PAT is used only
#                for the tag push; every other step uses GITHUB_TOKEN.
#                Do not reuse RUNNER_REG_PAT: its purpose is runner
#                registration only; coupling both capabilities to one
#                credential widens the blast radius of a leak.

# Runs unattended: after every green CI on main (workflow_run) and daily
# (schedule), advancing v2 with the same probe and input-diff gates as a hand
# dispatch. A merged fix used to reach no consumer until someone remembered to
# dispatch this by hand; v2 sat 33 commits behind main. When an automatic
# advance fails, the failed check is recorded in one open issue (see the
# report-failure job) so the block is visible instead of silent.
on:
  workflow_run:
    workflows: [CI, EC2 spill probe]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run all checks and report results but do not move the tag.
        type: boolean
        default: false
      tag:
        description: >-
          Which major tag to move. v2 is the first cut of a new major: it does
          not exist yet, so the input-diff and interface checks (which compare
          against the tag being moved) are skipped on that first cut and the
          tag lands at the latest green commit on main. Later advances of v2
          are checked against v2.
        type: choice
        options: [v1, v2]
        default: v1
      consumers-updated:
        description: >-
          Evidence that every consumer already passes the changed action
          inputs. When new inputs carry defaults and no consumer update is
          needed, state that directly ("all N inputs default; no consumer
          change required") so the audit trail records the reasoning. When
          consumers did update, supply PR or commit links, one per consumer.
          Required whenever the action interface changed since v1; the run
          refuses without it and records whatever is given as the audit trail.
        type: string
        default: ''

permissions:
  contents: write
  actions: read
  issues: write
  id-token: write   # OIDC for the read-only spill AMI lookup in check-ami

# One advance at a time; a newer trigger waits rather than racing the tag push.
concurrency:
  group: advance-tag
  cancel-in-progress: false

env:
  # Non-dispatch triggers carry no inputs: they advance v2.
  TAG: ${{ inputs.tag || 'v2' }}

jobs:
  find-green:
    # A workflow_run fires for every CI conclusion; only a success advances.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.find-green.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest green commit on main
        id: find-green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          found=""
          while IFS= read -r sha; do
            # A gh failure must surface verbatim, never read as "no green run".
            if ! out=$(gh run list \
              --repo "${{ github.repository }}" \
              --commit "$sha" \
              --workflow ci.yml \
              --status completed \
              --limit 1 \
              --json conclusion \
              -q '.[0].conclusion // empty' 2>&1); then
              echo "::error::gh run list failed for $sha: $out"
              exit 1
            fi
            if [ "$out" = "success" ]; then
              found="$sha"
              break
            fi
          done < <(git log --format='%H' origin/main | head -50)
          if [ -z "$found" ]; then
            echo "::error::No green CI run found in the last 50 commits on main. Trigger ci.yml via workflow_dispatch on main and wait for it to pass, then re-run this workflow."
            exit 1
          fi
          echo "target=$found" >> "$GITHUB_OUTPUT"
          echo "Latest green commit on main:"
          git log --oneline -1 "$found"

  # Static check: the probe must pass every input that consumers pass to the
  # actions. A missing input causes the probe to fail with a confusing error
  # (TLS, auth, or a missing required variable) rather than naming the gap.
  # Running this before the probe means a misconfigured probe is caught in
  # seconds, not after a clone is leaked.
  check-probe-inputs:
    needs: find-green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check probe passes all required action inputs
        run: |
          fail=0
          for action in provision teardown; do
            echo "--- ${action}/action.yml ---"
            also=""
            [ "$action" = teardown ] && also="consumer-result"
            if ! ALSO_REQUIRE="$also" bash scripts/check-action-inputs.sh \
                 "${action}/action.yml" \
                 ".github/workflows/advance-v1.yml"; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::The probe in advance-v1.yml is missing required inputs — update the probe to pass all required inputs before advancing v1."
            exit 1
          fi

  # The tag must not move to a ref whose spill AMI was never built or never
  # probed green: provision.sh hashes the AMI inputs at the consumer's ref and
  # refuses any AMI not tagged with that hash, so every spill fails as stale
  # (#149 and #153, 2026-10-13). Backstop for a change merged before its AMI.
  #
  # On an automatic trigger a missing AMI is not a failure: the commit that
  # changed the AMI inputs goes green before its own image exists, so that
  # advance would fail by construction (sp-h8p1u2). It skips the rest quietly
  # and the EC2 spill probe completing re-triggers the advance. A hand dispatch
  # still fails on a missing AMI.
  check-ami:
    needs: find-green
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
          aws-region: us-west-2

      - name: Require a built, probe-passed spill AMI for the target
        id: check
        run: |
          rc=0
          bash scripts/check-ami-for-ref.sh "${{ needs.find-green.outputs.target }}" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No probe-passed spill AMI for the target yet; skipping this advance. The EC2 spill probe passing re-triggers it."
            echo "### Advance skipped: the target's spill AMI is not built and probed yet" >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$rc"
          fi

  # Provisions a real VM using the candidate's own actions. A green CI run
  # proves the scripts pass unit tests; this proves they work end-to-end
  # against the real template and node.
  probe-provision:
    needs: [find-green, check-probe-inputs, check-ami]
    if: needs.check-ami.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      vmid:     ${{ steps.provision.outputs.vmid }}
      label:    ${{ steps.provision.outputs.label }}
      vm-token: ${{ steps.provision.outputs.vm-token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find-green.outputs.target }}

      - name: Probe provision at candidate SHA
        id: provision
        uses: ./provision
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-api-hostname:   ${{ vars.PVE_API_HOSTNAME }}
          pve-ca-cert:        ${{ vars.PVE_CA_CERT }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}

  # Tears down the VM provisioned above. Runs in its own job on a fresh
  # runner so the Tailscale setup does not collide with probe-provision's.
  # if: always() ensures cleanup runs even when provision failed mid-way.
  probe-teardown:
    needs: [find-green, check-ami, probe-provision]
    runs-on: ubuntu-latest
    if: always() && needs.check-ami.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find-green.outputs.target }}

      - name: Probe teardown at candidate SHA
        if: needs.probe-provision.outputs.vmid != ''
        uses: ./teardown
        with:
          vmid:               ${{ needs.probe-provision.outputs.vmid }}
          label:              ${{ needs.probe-provision.outputs.label }}
          vm-token:           ${{ needs.probe-provision.outputs.vm-token }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-api-hostname:   ${{ vars.PVE_API_HOSTNAME }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}
          pve-ca-cert:        ${{ vars.PVE_CA_CERT }}
          consumer-result:    ${{ needs.probe-provision.result }}

  advance:
    needs: [find-green, check-ami, probe-provision, probe-teardown]
    if: success() && needs.check-ami.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false is load-bearing. Checkout otherwise writes
      # GITHUB_TOKEN into http.https://github.com/.extraheader, which git sends
      # in preference to the PAT in the remote URL, so the tag push would
      # authenticate as the GitHub App and be refused across a workflow-file
      # change (run 38074627406). scripts/test-advance-credentials.sh asserts it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show current tag and target
        run: |
          current=$(git rev-parse "refs/tags/${TAG}" 2>/dev/null || echo "(not set)")
          target="${{ needs.find-green.outputs.target }}"
          echo "Current $TAG : $current"
          echo "Target     : $target"
          if [ "$current" = "$target" ]; then
            echo "$TAG is already at the latest green commit. Nothing to do."
          fi

      # Classifies the provision/teardown interface diff against the tag being
      # moved (scripts/check-advance-inputs.sh). Breaking changes (removed
      # input/output, newly required input, changed default) refuse unless
      # consumers-updated names the evidence; additive ones (a new optional
      # input with a default, a new output) cannot break a consumer, so they
      # pass with a note in the run summary and need no hand dispatch.
      - name: Classify action interface changes since the tag
        env:
          CONSUMERS_UPDATED: ${{ inputs.consumers-updated }}
        run: |
          target="${{ needs.find-green.outputs.target }}"
          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "No $TAG tag yet — skipping interface check."
            exit 0
          fi
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          breaking=""
          safe=""
          for action in provision teardown; do
            echo "--- ${action}/action.yml ---"
            git show "refs/tags/${TAG}:${action}/action.yml" > "$WORK/base.yml"
            git show "${target}:${action}/action.yml"        > "$WORK/cand.yml"
            rc=0
            bash scripts/check-advance-inputs.sh "$WORK/base.yml" "$WORK/cand.yml" \
              >"$WORK/out" 2>"$WORK/err" || rc=$?
            cat "$WORK/out"
            cat "$WORK/err" >&2
            [ "$rc" -le 1 ] || { echo "::error::check-advance-inputs.sh failed (exit $rc) on ${action}"; exit 1; }
            while IFS= read -r line; do
              safe="${safe}${action}: ${line#safe }"$'\n'
            done < <(grep '^safe ' "$WORK/out" || true)
            while IFS= read -r line; do
              breaking="${breaking}${action}: ${line#breaking }"$'\n'
            done < <(grep '^breaking ' "$WORK/err" || true)
          done

          if [ -n "$safe" ]; then
            {
              echo "### Additive interface changes since $TAG (cannot break consumers)"
              echo
              printf '%s' "$safe" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -z "$breaking" ]; then
            echo "No breaking interface changes since $TAG."
            exit 0
          fi

          # A FENCE IS A REFUSAL, NOT A WALL: consumers-updated is the door. It
          # does not weaken the check; passing it requires naming the evidence,
          # which lands in the log and the job summary for audit
          # (law-never-disarm-a-check-to-proceed).
          if [ -z "$CONSUMERS_UPDATED" ]; then
            echo "::error::Breaking action interface changes since $TAG:"
            printf '%s' "$breaking" | while IFS= read -r l; do echo "::error::  $l"; done
            echo "::error::Either cut a new major version and coordinate consumer updates, or re-run with consumers-updated naming the PRs that updated every consumer."
            {
              echo "### Advance blocked: breaking interface changes"
              echo
              printf '%s' "$breaking" | sed 's/^/- `/; s/$/`/'
              echo
              echo "Way through: supply \`consumers-updated\` naming the PRs that updated every consumer and re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::warning::Breaking interface changes since $TAG; proceeding on consumers-updated evidence."
          {
            echo "### $TAG advanced across breaking interface changes"
            echo
            printf '%s' "$breaking" | sed 's/^/- `/; s/$/`/'
            echo
            echo "Consumers reported updated:"
            echo
            echo "${CONSUMERS_UPDATED}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: inputs.dry-run == true
        run: |
          target="${{ needs.find-green.outputs.target }}"
          {
            echo "### Dry run — checks passed, tag not moved"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Probe (provision + teardown) | passed |"
            echo "| Breaking interface changes | none |"
            echo "| Target | \`${target}\` |"
            echo
            echo "Re-run with **dry-run: false** to advance the tag."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run complete. Target: $target"

      - name: Advance tag
        if: inputs.dry-run != true
        env:
          GH_TOKEN_WORKFLOW: ${{ secrets.V1_TAG_PAT }}
        run: |
          if [ -z "$GH_TOKEN_WORKFLOW" ]; then
            echo "::error::V1_TAG_PAT secret is not set. Create a PAT with 'workflow' and 'repo' scopes and add it as V1_TAG_PAT before running this workflow. Falling back to GITHUB_TOKEN would reproduce this failure silently after the probe has already provisioned and torn down a real VM."
            exit 1
          fi
          target="${{ needs.find-green.outputs.target }}"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN_WORKFLOW}@github.com/${{ github.repository }}.git"
          git tag -f "$TAG" "$target"
          git push origin "$TAG" --force
          echo "::notice::$TAG advanced to $target"

  # An automatic advance has no one watching its run. When it fails, open (or
  # comment on) the single "v2 advance blocked" issue naming the failed jobs
  # and steps, so the blocking check is visible without reading run logs.
  report-failure:
    needs: [find-green, check-ami, check-probe-inputs, probe-provision, probe-teardown, advance]
    if: failure() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the advance-blocked issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          blocking=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- job `\(.name)`, step(s): \([.steps[] | select(.conclusion == "failure") | .name] | join(", "))"')
          [ -n "$blocking" ] || blocking="- (no failed job found; see the run)"
          title="$TAG advance blocked"
          body=$(printf 'The automatic advance of `%s` failed. Blocking check(s):\n\n%s\n\nRun: %s\n' "$TAG" "$blocking" "$RUN_URL")
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
