name: Advance v1

# Moves the v1 tag to the most recent commit on main whose CI concluded
# "success". Consumers pin @v1; this is the documented path for landing
# a batch of changes onto them.
#
# Before moving the tag, two checks must pass:
#   1. Probe: provision and teardown a real VM at the candidate SHA. A
#      candidate whose provision.sh refuses the template, or whose teardown
#      fails, cannot be v1 — consumers would break immediately.
#   2. Input diff: any new required input without a default in provision or
#      teardown breaks every consumer that has not yet added it. The check
#      names the input and the way through.
#
# CI must be running on push to main (ci.yml's push trigger) for this to
# find green commits reliably. For commits that predate that trigger,
# manually dispatch ci.yml on main first, wait for it to pass, then run
# this workflow.
#
# Secrets required:
#   V1_TAG_PAT — a Personal Access Token with 'workflow' and 'repo' scopes.
#                GITHUB_TOKEN cannot push a tag that moves across a workflow
#                file change (GitHub App restriction). This PAT is used only
#                for the tag push; every other step uses GITHUB_TOKEN.
#                Do not reuse RUNNER_REG_PAT: its purpose is runner
#                registration only; coupling both capabilities to one
#                credential widens the blast radius of a leak.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run all checks and report results but do not move the tag.
        type: boolean
        default: false
      consumers-updated:
        description: >-
          Evidence that every consumer already passes the changed action
          inputs. When new inputs carry defaults and no consumer update is
          needed, state that directly ("all N inputs default; no consumer
          change required") so the audit trail records the reasoning. When
          consumers did update, supply PR or commit links, one per consumer.
          Required whenever the action interface changed since v1; the run
          refuses without it and records whatever is given as the audit trail.
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  find-green:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.find-green.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest green commit on main
        id: find-green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          found=""
          while IFS= read -r sha; do
            conclusion=$(gh run list \
              --repo "${{ github.repository }}" \
              --commit "$sha" \
              --workflow ci.yml \
              --status completed \
              --limit 1 \
              --json conclusion \
              -q '.[0].conclusion // empty' 2>/dev/null || true)
            if [ "$conclusion" = "success" ]; then
              found="$sha"
              break
            fi
          done < <(git log --format='%H' origin/main | head -50)
          if [ -z "$found" ]; then
            echo "::error::No green CI run found in the last 50 commits on main. Trigger ci.yml via workflow_dispatch on main and wait for it to pass, then re-run this workflow."
            exit 1
          fi
          echo "target=$found" >> "$GITHUB_OUTPUT"
          echo "Latest green commit on main:"
          git log --oneline -1 "$found"

  # Static check: the probe must pass every input that consumers pass to the
  # actions. A missing input causes the probe to fail with a confusing error
  # (TLS, auth, or a missing required variable) rather than naming the gap.
  # Running this before the probe means a misconfigured probe is caught in
  # seconds, not after a clone is leaked.
  check-probe-inputs:
    needs: find-green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check probe passes all required action inputs
        run: |
          fail=0
          for action in provision teardown; do
            echo "--- ${action}/action.yml ---"
            if ! bash scripts/check-action-inputs.sh \
                 "${action}/action.yml" \
                 ".github/workflows/advance-v1.yml"; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::The probe in advance-v1.yml is missing required inputs — update the probe to pass all required inputs before advancing v1."
            exit 1
          fi

  # Provisions a real VM using the candidate's own actions. A green CI run
  # proves the scripts pass unit tests; this proves they work end-to-end
  # against the real template and node.
  probe-provision:
    needs: [find-green, check-probe-inputs]
    runs-on: ubuntu-latest
    outputs:
      vmid:     ${{ steps.provision.outputs.vmid }}
      label:    ${{ steps.provision.outputs.label }}
      vm-token: ${{ steps.provision.outputs.vm-token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find-green.outputs.target }}

      - name: Probe provision at candidate SHA
        id: provision
        uses: ./provision
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-api-hostname:   ${{ vars.PVE_API_HOSTNAME }}
          pve-ca-cert:        ${{ vars.PVE_CA_CERT }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}

  # Tears down the VM provisioned above. Runs in its own job on a fresh
  # runner so the Tailscale setup does not collide with probe-provision's.
  # if: always() ensures cleanup runs even when provision failed mid-way.
  probe-teardown:
    needs: [find-green, probe-provision]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find-green.outputs.target }}

      - name: Probe teardown at candidate SHA
        if: needs.probe-provision.outputs.vmid != ''
        uses: ./teardown
        with:
          vmid:               ${{ needs.probe-provision.outputs.vmid }}
          label:              ${{ needs.probe-provision.outputs.label }}
          vm-token:           ${{ needs.probe-provision.outputs.vm-token }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-api-hostname:   ${{ vars.PVE_API_HOSTNAME }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}
          pve-ca-cert:        ${{ vars.PVE_CA_CERT }}

  advance:
    needs: [find-green, probe-provision, probe-teardown]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show current v1 and target
        run: |
          current=$(git rev-parse refs/tags/v1 2>/dev/null || echo "(not set)")
          target="${{ needs.find-green.outputs.target }}"
          echo "Current v1 : $current"
          echo "Target     : $target"
          if [ "$current" = "$target" ]; then
            echo "v1 is already at the latest green commit. Nothing to do."
          fi

      - name: Check for new required inputs since v1
        env:
          CONSUMERS_UPDATED: ${{ inputs.consumers-updated }}
        run: |
          target="${{ needs.find-green.outputs.target }}"
          if ! git rev-parse --verify refs/tags/v1 >/dev/null 2>&1; then
            echo "No v1 tag yet — skipping input-diff check."
            exit 0
          fi
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          for action in provision teardown; do
            mkdir -p "$WORK/v1" "$WORK/candidate"
            git show "refs/tags/v1:${action}/action.yml" > "$WORK/v1/${action}.yml"
            git show "${target}:${action}/action.yml"    > "$WORK/candidate/${action}.yml"
          done

          blocking_inputs=""
          for action in provision teardown; do
            echo "--- ${action}/action.yml ---"
            err_file=$(mktemp)
            if ! bash scripts/check-advance-inputs.sh \
                   "$WORK/v1/${action}.yml" \
                   "$WORK/candidate/${action}.yml" 2>"$err_file"; then
              cat "$err_file" >&2
              while IFS= read -r line; do
                [[ "$line" == *"new required input without default: "* ]] || continue
                name="${line##*new required input without default: }"
                blocking_inputs="${blocking_inputs}${name} "
              done < "$err_file"
            fi
            rm -f "$err_file"
          done

          blocking_inputs="${blocking_inputs% }"

          if [ -n "$blocking_inputs" ]; then
            if [ -n "$CONSUMERS_UPDATED" ]; then
              echo "::warning::New required inputs without defaults: ${blocking_inputs}; proceeding on consumers-updated evidence."
              {
                echo "### Required inputs added; proceeding on consumers-updated evidence"
                echo
                echo "New required inputs (no default): \`${blocking_inputs}\`"
                echo
                echo "Consumers reported updated:"
                echo
                echo "${CONSUMERS_UPDATED}"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Advance blocked: new required inputs without defaults: ${blocking_inputs}"
              echo "::error::Add a default value to each listed input, or supply consumers-updated naming the PRs that updated every consumer."
              {
                echo "### Advance blocked: new required inputs"
                echo
                echo "New required inputs (no default): \`${blocking_inputs}\`"
                echo
                echo "Way through: add \`default: ''\` to each input, or supply \`consumers-updated\` naming the PRs that updated every consumer and re-run."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo "No new required inputs without defaults."
          fi

      - name: Check for action interface changes since v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="${{ needs.find-green.outputs.target }}"
          if ! git rev-parse --verify refs/tags/v1 >/dev/null 2>&1; then
            echo "No v1 tag yet — skipping interface check."
            exit 0
          fi
          # Detect additions or removals in the inputs: or outputs: sections of
          # either action file. A line changed under those sections means the
          # public contract shifted and consumers must update before this advance
          # is safe. Cut a new major version (v2) instead.
          #
          # Pattern: any added/removed line that is either the inputs:/outputs:
          # top-level key itself, or a 2-space-indented first-level YAML entry
          # (the input/output names and their direct properties).
          if git diff "refs/tags/v1" "$target" -- \
               provision/action.yml teardown/action.yml \
             | grep -E '^[+-][^+-]' \
             | grep -qE '^[+-](inputs:|outputs:|  [a-z][a-z0-9-]*:)'; then
            # A FENCE IS A REFUSAL, NOT A WALL, AND THIS ONE HAD NO DOOR.
            #
            # The check is right: advancing v1 across an interface change
            # breaks every consumer that has not been updated. But it can only
            # see THIS repository, so once the consumers genuinely have been
            # updated it goes on refusing, and the only ways past it are
            # cutting a v2 nobody wants or moving the tag by hand — which
            # disarms the check silently and leaves no record that anyone
            # thought about it (law-never-disarm-a-check-to-proceed).
            #
            # consumers-updated is the door. It does not weaken the check: the
            # refusal still fires by default, and passing it requires naming
            # the evidence, which lands in the log and the job summary where
            # the next person can audit the claim.
            if [ -z "${{ inputs.consumers-updated }}" ]; then
              echo "::error::This commit changes action inputs or outputs in provision/action.yml or teardown/action.yml relative to v1."
              echo "::error::Advancing v1 will silently break consumers that have not updated their workflows to pass or receive the changed fields."
              echo "::error::Either cut a new major version (v2) and coordinate the consumer updates, or re-run with consumers-updated naming the PRs that updated every consumer."
              exit 1
            fi
            echo "::warning::Interface changed since v1; proceeding on the operator's evidence."
            {
              echo "### v1 advanced across an action interface change"
              echo
              echo 'Consumers reported updated:'
              echo
              echo '${{ inputs.consumers-updated }}'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "No action interface changes since v1."

      - name: Dry-run summary
        if: inputs.dry-run == true
        run: |
          target="${{ needs.find-green.outputs.target }}"
          {
            echo "### Dry run — checks passed, tag not moved"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Probe (provision + teardown) | passed |"
            echo "| New required inputs | none |"
            echo "| Target | \`${target}\` |"
            echo
            echo "Re-run with **dry-run: false** to advance the tag."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run complete. Target: $target"

      - name: Advance v1 tag
        if: inputs.dry-run == false
        env:
          GH_TOKEN_WORKFLOW: ${{ secrets.V1_TAG_PAT }}
        run: |
          if [ -z "$GH_TOKEN_WORKFLOW" ]; then
            echo "::error::V1_TAG_PAT secret is not set. Create a PAT with 'workflow' and 'repo' scopes and add it as V1_TAG_PAT before running this workflow. Falling back to GITHUB_TOKEN would reproduce this failure silently after the probe has already provisioned and torn down a real VM."
            exit 1
          fi
          target="${{ needs.find-green.outputs.target }}"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN_WORKFLOW}@github.com/${{ github.repository }}.git"
          git tag -f v1 "$target"
          git push origin v1 --force
          echo "::notice::v1 advanced to $target"
