name: EC2 spill probe

# Probes the EC2 spill path on a freshly built AMI and promotes it only on a pass.
# Provisions a runner with SPILL=ec2-only (bypassing Proxmox entirely) from the
# newest AMI, asserts the launched instance IS that AMI, runs podman and every
# consuming repo's runner-deps on it, starts each repo's first real test
# (it need not finish), then tears down. provision.sh launches only
# AMIs tagged spill:probe=passed, and the promote job is the only thing that sets
# that tag, so a broken AMI is found here in minutes, not by a real CI job.
#
# Triggers: the "Build spill AMI" workflow completing successfully, and on
# demand. DO NOT add push:, pull_request:, or schedule: triggers. A probe that
# fires on every commit spends money automatically; this one fires once per AMI.
# Target wall: under 15 minutes from AMI build success to verdict when the
# registry holds the test image; a cold image build is bounded by verify's 30.

on:
  workflow_run:
    workflows: ["Build spill AMI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ami-id:
        description: AMI to probe (default is the newest spill AMI)
        required: false
        default: ''

# A second dispatch queues rather than cancelling. Cancelling mid-provision
# would orphan the EC2 instance with no teardown job to reclaim it.
concurrency:
  group: ec2-spill-probe
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC token for assuming the AWS spill role
  actions: read     # runners API for watchdog
  issues: write     # report files the P0 on a failed probe

jobs:
  # Names the AMI under test once, so provision, verify and promote agree.
  resolve:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ami-id: ${{ steps.ami.outputs.ami-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
          aws-region: us-west-2

      - name: Find the AMI under test
        id: ami
        env:
          REQUESTED: ${{ inputs.ami-id }}
        run: |
          if [ -n "$REQUESTED" ]; then
            ami="$REQUESTED"
          else
            ami="$(aws ec2 describe-images \
              --filters 'Name=tag:spill:owner,Values=ephemeral-ci' 'Name=state,Values=available' \
              --query 'sort_by(Images, &CreationDate)[-1].ImageId' --output text)"
          fi
          test -n "$ami" && test "$ami" != None || { echo "::error::no spill AMI to probe"; exit 1; }
          echo "Probing $ami"
          echo "ami-id=$ami" >> "$GITHUB_OUTPUT"

  provision:
    needs: [resolve]
    runs-on: ubuntu-latest
    outputs:
      vmid:        ${{ steps.provision.outputs.vmid }}
      label:       ${{ steps.provision.outputs.label }}
      vm-token:    ${{ steps.provision.outputs.vm-token }}
      backend:     ${{ steps.provision.outputs.backend }}
      instance-id: ${{ steps.provision.outputs.instance-id }}
      tailnet:     ${{ steps.provision.outputs.tailnet }}
    steps:
      - uses: actions/checkout@v4

      - name: Provision EC2 runner (ec2-only)
        id: provision
        uses: ./provision
        with:
          ts-oauth-client-id:  ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:     ${{ secrets.TS_OAUTH_SECRET }}
          runner-reg-pat:      ${{ secrets.RUNNER_REG_PAT }}
          pve-token-id:        ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:    ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:        ${{ vars.PVE_API_HOST }}
          pve-api-hostname:    ${{ vars.PVE_API_HOSTNAME }}
          pve-ca-cert:         ${{ vars.PVE_CA_CERT }}
          pve-node:            ${{ vars.PVE_NODE }}
          template-vmid:       ${{ vars.TEMPLATE_VMID }}
          spill:               ec2-only
          spill-tailnet:       'true'
          aws-role-to-assume:  ${{ secrets.AWS_SPILL_ROLE_ARN }}
          spill-ami-id:        ${{ needs.resolve.outputs.ami-id }}

  # Confirms the provisioned runner came online before verify is allowed to
  # proceed. Runs on ubuntu-latest so it can never queue: if it times out,
  # verify is skipped and teardown fires immediately instead of waiting up to
  # 24 hours for GitHub's queue limit.
  #
  # Reports one failure mode here:
  #   "runner never came online" — instance started but runner never registered
  #
  # Whether the runner accepted work is observable only from a job that runs
  # concurrently with verify (not upstream of it). That check lives in `guard`.
  watchdog:
    needs: [provision]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for runner to come online
        env:
          GH_TOKEN: ${{ secrets.RUNNER_REG_PAT }}
          RUNNER_LABEL: ${{ needs.provision.outputs.label }}
        run: |
          echo "Watching for runner: $RUNNER_LABEL"

          # Runner must reach online status within 3 minutes.
          # The instance reaches SSM in ~19s and registers seconds after that,
          # so 3 minutes is generous but well within the job timeout.
          #
          # Runners register at the org level (not repo level) — see
          # scripts/guest/start-runner.sh. The default GITHUB_TOKEN cannot read
          # org runners, so RUNNER_REG_PAT is required here, matching what the
          # provision action uses in its "Wait for the runner to register" step.
          deadline_online=$(( $(date +%s) + 180 ))
          runner_online=false
          while [ "$(date +%s)" -lt "$deadline_online" ]; do
            status=$(gh api \
              "orgs/${{ github.repository_owner }}/actions/runners" \
              --paginate \
              --jq ".runners[] | select(.labels[].name == \"$RUNNER_LABEL\") | .status" \
              2>/dev/null | head -1 || true)
            if [ "$status" = "online" ]; then
              echo "Runner '$RUNNER_LABEL' is online."
              runner_online=true
              break
            fi
            echo "Runner '$RUNNER_LABEL': ${status:-not found}. Retrying in 10s..."
            sleep 10
          done

          if ! $runner_online; then
            echo "::error::Runner '$RUNNER_LABEL' did not come online within 3 minutes — instance started but runner never registered."
            exit 1
          fi

  # Runs concurrently with verify. Polls whether verify has left the queue
  # within this job's timeout. If it has not, the runner is online but the
  # job was not routed to it — fail fast so teardown fires and the instance
  # is reclaimed rather than waiting for GitHub's 24-hour queue limit.
  #
  # needs: [provision, watchdog], NOT [verify] — adding verify here would
  # recreate the unsatisfiable gate this job was added to break (db-vjuf).
  guard:
    needs: [provision, watchdog]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard — verify must leave the queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="${{ github.run_id }}"
          repo="${{ github.repository }}"
          runner_label="${{ needs.provision.outputs.label }}"

          # verify runs concurrently with this job. If the runner is online but
          # the job is not routed to it (wrong label, saturated queue), verify
          # stays queued indefinitely. Detect that here and fail fast so
          # teardown fires instead of waiting up to the runner timeout.
          deadline=$(( $(date +%s) + 270 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            status=$(gh api "repos/${repo}/actions/runs/${run_id}/jobs" \
              --jq '.jobs[] | select(.name == "verify") | .status' \
              2>/dev/null | head -1 || true)
            if [ "$status" = "in_progress" ] || [ "$status" = "completed" ]; then
              echo "verify job left the queue (status: $status)."
              exit 0
            fi
            echo "verify job status: ${status:-unknown}. Waiting..."
            sleep 10
          done

          echo "::error::Runner '$runner_label' came online but the verify job did not start within the guard's budget — job may not have been routed to this runner."
          exit 1

  # Runs a trivial command on the provisioned EC2 runner. If this job never
  # starts, the runner did not register despite provision exiting zero —
  # launch and registration are two separate failure modes.
  #
  # timeout-minutes is deliberately small: the instance reaches SSM in ~19s
  # and the runner registers seconds after that. Single-digit minutes is
  # already generous. A large timeout defeats the point — the probe must fail
  # fast so teardown runs. Same fix as db-ise2 applied to the repository gate.
  verify:
    needs: [resolve, provision, watchdog]
    runs-on: [self-hosted, "${{ needs.provision.outputs.label }}"]
    timeout-minutes: 30
    steps:
      - name: Verify runner is operational
        run: uname -a

      # A probe that ran on some other image proves nothing about the AMI it
      # then promotes.
      - name: Assert the instance was launched from the AMI under test
        env:
          WANT_AMI: ${{ needs.resolve.outputs.ami-id }}
        run: |
          token="$(curl -sf -X PUT http://169.254.169.254/latest/api/token \
            -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')"
          have="$(curl -sf -H "X-aws-ec2-metadata-token: $token" \
            http://169.254.169.254/latest/meta-data/ami-id)"
          echo "instance ImageId: $have, AMI under test: $WANT_AMI"
          test "$have" = "$WANT_AMI"

      # The Proxmox runner runs the consumers' parallel gates to completion; a
      # smaller disk stops them at the floor (sp-6rzyjn). 60G is SPILL_MIN_FREE_GIB in
      # scripts/provision.sh; keep the two together.
      - name: Assert free disk matches the Proxmox runner's
        run: |
          df -h /
          have="$(df -BG --output=avail / | tail -1 | tr -dc 0-9)"
          echo "free on /: ${have}G, required: 60G"
          test "$have" -ge 60

      - name: Assert podman info works as the runner user
        run: podman info >/dev/null

      - name: Assert rootless container network backend is present
        run: |
          # bash -e would abort on the substitution before podman's error was shown.
          set +e
          out=$(podman info --format '{{.Host.NetworkBackend}}' 2>&1)
          rc=$?
          set -e
          echo "podman info exit=$rc XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-unset} uid=$(id -u)"
          echo "$out"
          test "$rc" -eq 0 || exit "$rc"
          test -n "$out" || { echo "ERROR: podman info returned no network backend"; exit 1; }

      # The instance must be in the tailnet as tag:round-vm and reach the cache
      # port. vars.SPILL_PROBE_CACHE_ADDR is the Spira host's sccache-dav
      # <host>:<port>, the one destination the ACL lets tag:round-vm reach.
      - name: Assert the instance joined the tailnet as tag:round-vm
        env:
          CACHE_ADDR: ${{ vars.SPILL_PROBE_CACHE_ADDR }}
          TAILNET_STATE: ${{ needs.provision.outputs.tailnet }}
        run: |
          test "$TAILNET_STATE" = "up" || { echo "ERROR: provision reported tailnet='$TAILNET_STATE'"; exit 1; }
          tailscale status --json | python3 -c '
          import json,sys
          me=json.load(sys.stdin)["Self"]
          tags=me.get("Tags") or []
          print("self:", me.get("HostName"), tags)
          sys.exit(0 if "tag:round-vm" in tags else 1)'
          test -n "$CACHE_ADDR" || { echo "ERROR: vars.SPILL_PROBE_CACHE_ADDR is not set"; exit 1; }
          timeout 10 bash -c "exec 3<>/dev/tcp/${CACHE_ADDR%:*}/${CACHE_ADDR##*:}" \
            && echo "cache port ${CACHE_ADDR} reachable"

      - name: Assert rootless container can start
        # podman info succeeding does not prove a container can start.
        # The substrate's own comment notes rootless podman aborts with
        # "could not find pasta" at RUN time, not at info time.
        run: podman run --rm docker.io/library/busybox:latest true

      # Each consuming repo's own runner-deps step, run for real on the probe
      # instance (it is thrown away), so a dependency the AMI lacks fails here
      # and not in that repo's first spilled CI job.
      - uses: actions/checkout@v4
        with:
          path: ephemeral-ci

      # The Proxmox template runs this series; an image on another one makes a
      # spilled job fail tests a template job passes (sp-2h5q0k). The series is
      # the one source in template-substrate.sh, so a drifted image is not promoted.
      - name: Assert container engine version parity with the template
        run: |
          want="$(sed -n 's/^PODMAN_SERIES=//p' ephemeral-ci/scripts/template-substrate.sh)"
          have="$(podman version --format '{{.Client.Version}}')"
          echo "podman on the AMI: $have, template series: $want"
          test -n "$want"
          case "$have" in "$want".*) ;; *) echo "::error::podman $have is not the template's $want.x"; exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/spira
          token: ${{ secrets.RUNNER_REG_PAT }}
          path: consumers/spira
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pokedumpster
          token: ${{ secrets.RUNNER_REG_PAT }}
          path: consumers/pokedumpster
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deckdumpster
          token: ${{ secrets.RUNNER_REG_PAT }}
          path: consumers/deckdumpster

      # Each path is the one that repo's own CI runs (its ci.yml / gate.yml
      # "Host dependencies" step); spira keeps its script under spira/, the others
      # under deploy/. Every step runs even when an earlier one fails, and the
      # aggregate step below gives one verdict naming each repo.
      - name: runner-deps (spira)
        id: deps-spira
        continue-on-error: true
        working-directory: consumers/spira
        run: bash spira/runner-deps.sh
      - name: runner-deps (pokedumpster)
        id: deps-pokedumpster
        continue-on-error: true
        working-directory: consumers/pokedumpster
        run: bash deploy/runner-deps.sh
      - name: runner-deps (deckdumpster)
        id: deps-deckdumpster
        continue-on-error: true
        working-directory: consumers/deckdumpster
        run: bash deploy/runner-deps.sh

      - name: runner-deps verdict
        if: always()
        env:
          SPIRA: ${{ steps.deps-spira.outcome }}
          POKEDUMPSTER: ${{ steps.deps-pokedumpster.outcome }}
          DECKDUMPSTER: ${{ steps.deps-deckdumpster.outcome }}
        run: bash ephemeral-ci/scripts/spill-probe-verdict.sh spira="$SPIRA" pokedumpster="$POKEDUMPSTER" deckdumpster="$DECKDUMPSTER"

      # runner-deps proves the packages exist; only a test that starts proves
      # the repo can begin work on this image. Each step runs the repo's own
      # entry point and passes the moment the repo's OWN output says its first
      # test began, then stops it. A command that exits or stalls before the
      # marker fails that step. Every step runs even when an earlier one fails,
      # and the verdict step below names each repo, so one repo's failure cannot
      # hide whether the others started.
      #
      # Spira's path is its gate's: published release (carries testenv), test
      # image, then testenv's own suite-start line. The 900 s is sized to an
      # image pull, or a cold build when the registry has no image.
      # Spira's first-test step was removed 2026-10-12 (per Ryan: a real repo's test has started on
      # the spill runner -- pokedumpster and deckdumpster, run 38199675249 -- so a probe step that
      # fails for its own reasons (gh not installed for the release fetch) must not block AMI
      # promotion). Spira's runner-deps still runs above; its real test path is proven by its own CI.
      - name: first test starts (pokedumpster)
        id: first-pokedumpster
        continue-on-error: true
        working-directory: consumers/pokedumpster
        env:
          INSTANCE: ci-spill-probe
        run: bash "$GITHUB_WORKSPACE/ephemeral-ci/scripts/spill-probe-first-test.sh" pokedumpster 240 '^==> .*(self-test|_test\.sh|cargo test)' -- bash deploy/ci.sh
      - name: first test starts (deckdumpster)
        id: first-deckdumpster
        continue-on-error: true
        working-directory: consumers/deckdumpster
        env:
          INSTANCE: ci-spill-probe
        run: bash "$GITHUB_WORKSPACE/ephemeral-ci/scripts/spill-probe-first-test.sh" deckdumpster 240 '^==> Run unit tests' -- bash deploy/ci.sh

      - name: first test verdict
        if: always()
        env:
          POKEDUMPSTER: ${{ steps.first-pokedumpster.outcome }}
          DECKDUMPSTER: ${{ steps.first-deckdumpster.outcome }}
        run: bash ephemeral-ci/scripts/spill-probe-verdict.sh --what "first test" pokedumpster="$POKEDUMPSTER" deckdumpster="$DECKDUMPSTER"

  # Only a passing probe tags the AMI spill:probe=passed, which is what
  # provision.sh requires. Re-sending spill:owner satisfies the AmiBuildRole's
  # RequestTag condition on CreateTags.
  promote:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
          aws-region: us-west-2

      - name: Promote the AMI
        env:
          AMI: ${{ needs.resolve.outputs.ami-id }}
        run: |
          aws ec2 create-tags --resources "$AMI" \
            --tags Key=spill:owner,Value=ephemeral-ci Key=spill:probe,Value=passed
          echo "Promoted $AMI"

  # A failed probe files a P0 carrying the tail of the failing log.
  report:
    needs: [resolve, provision, watchdog, guard, verify]
    if: always() && (needs.provision.result == 'failure' || needs.watchdog.result == 'failure' || needs.guard.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: File the P0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AMI: ${{ needs.resolve.outputs.ami-id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tail="$(gh run view "${{ github.run_id }}" --log-failed 2>&1 | tail -40 || true)"
          bash scripts/spill-probe-report.sh "$AMI" "$RUN_URL" "$tail"

  # Terminates the EC2 instance regardless of earlier job outcomes.
  # if: always() ensures this runs even when provision, watchdog, guard, or
  # verify failed. guard failing (unroutable runner) unblocks teardown while
  # verify may still be queued — the instance is reclaimed before the queue
  # limit is reached.
  teardown:
    needs: [provision, watchdog, verify, guard]
    runs-on: ubuntu-latest
    if: always() && needs.provision.result != 'skipped'
    steps:
      - uses: actions/checkout@v4

      - name: Tear down EC2 runner
        uses: ./teardown
        with:
          vmid:               ${{ needs.provision.outputs.vmid }}
          label:              ${{ needs.provision.outputs.label }}
          vm-token:           ${{ needs.provision.outputs.vm-token }}
          backend:            ${{ needs.provision.outputs.backend }}
          instance-id:        ${{ needs.provision.outputs.instance-id }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-api-hostname:   ${{ vars.PVE_API_HOSTNAME }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}
          pve-ca-cert:        ${{ vars.PVE_CA_CERT }}
          aws-role-to-assume: ${{ secrets.AWS_SPILL_ROLE_ARN }}
          consumer-result:    ${{ needs.verify.result }}

  # After teardown the instance's node must be gone from the tailnet.
  left-tailnet:
    needs: [provision, teardown]
    if: always() && needs.provision.outputs.tailnet == 'up'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert the node left the tailnet
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          VM_TOKEN: ${{ needs.provision.outputs.vm-token }}
        run: bash scripts/tailnet.sh device-absent "spill-${VM_TOKEN}"
