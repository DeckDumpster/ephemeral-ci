name: Reap orphaned runner VMs

# THE BACKSTOP THAT WAS DOCUMENTED AND NEVER BUILT.
#
# Every consuming workflow tears its VM down under `if: always()`, which covers
# a failed or cancelled job. It does NOT cover a run GitHub drops, a
# cancellation landing between the clone and the vmid output, or the hypervisor
# rebooting mid-run. Without a reaper those become a hypervisor full of dead
# clones, discovered as a storage-full alert weeks later with no way to tell
# which clones are live.
#
# deckdumpster's README described this workflow in the present tense for the
# whole life of the feature. It did not exist. It lives here rather than in a
# consuming repository because the pool is org-wide: a VM leaked by one repo's
# run has to be reaped whether or not that repo's CI ever runs again.

on:
  schedule:
    # Hourly. MAX_AGE_HOURS defaults to 8, which is the 6h GitHub job ceiling
    # plus a 2h buffer, so this never races a running job.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print what would be destroyed and touch nothing.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write CA certificate
        env:
          PVE_CA_CERT: ${{ vars.PVE_CA_CERT }}
        run: |
          printf '%s\n' "$PVE_CA_CERT" > "$RUNNER_TEMP/pve-root-ca.pem"
          echo "PVE_CA_CERT_FILE=$RUNNER_TEMP/pve-root-ca.pem" >> "$GITHUB_ENV"

      - name: Reap
        id: reap
        env:
          PVE_API_HOST: ${{ vars.PVE_API_HOST }}
          PVE_API_HOSTNAME: ${{ vars.PVE_NODE }}
          PVE_NODE: ${{ vars.PVE_NODE }}
          TEMPLATE_VMID: ${{ vars.TEMPLATE_VMID }}
          PVE_TOKEN_ID: ${{ secrets.PVE_TOKEN_ID }}
          PVE_TOKEN_SECRET: ${{ secrets.PVE_TOKEN_SECRET }}
          CRED_FILE: /dev/null
          # The busy check reads the ORG runner list, which secrets.GITHUB_TOKEN
          # cannot see. Without a PAT here the check degrades to age-only and
          # says so in the log.
          GITHUB_TOKEN: ${{ secrets.RUNNER_REG_PAT }}
          GH_ORG: ${{ github.repository_owner }}
        run: |
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.dry-run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          # reap.sh writes its report to stderr and exits non-zero only when a
          # VM's age could not be determined. Capture both so the step below can
          # tell "reaped nothing" from "reaped something".
          set +e
          bash scripts/reap.sh "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/reap.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # AN ORPHAN IS A FINDING. A BROKEN REAPER IS A FAULT. THEY ARE NOT THE
      # SAME RUN STATE.
      #
      # This step used to exit 1 after a SUCCESSFUL reap, on the reasoning that
      # an orphan means some teardown failed and somebody should look. The
      # reasoning is right and the mechanism was wrong: it made "the reaper did
      # its job" and "the reaper is broken" render identically in `gh run list`,
      # as a red run. On 2026-09-18 that produced sp-wy2yl — "the VM reaper has
      # failed on every run for three days — no reaper is running on the
      # ephemeral-ci fleet" — filed against a reaper that had destroyed an
      # orphan on every one of those runs. The alarm did not just cost a false
      # bead; it consumed the attention that a real reaper outage would have
      # needed, which is the failure mode law-alerts-must-be-actionable names.
      #
      # So: one check per failure mode. A red run now means the reaper itself
      # failed, which is the condition nobody can see any other way. An orphan
      # is surfaced as a warning annotation and in the job summary, where it is
      # just as visible to a human and does not overload the run's colour.
      - name: Report orphans found
        if: always() && steps.reap.outcome != 'skipped'
        run: |
          log="$RUNNER_TEMP/reap.log"
          [ -f "$log" ] || exit 0
          n=$(sed -n 's/.*destroyed \([0-9]\+\) VM(s).*/\1/p' "$log" | tail -1)
          if [ -n "$n" ] && [ "$n" -gt 0 ]; then
            echo "::warning::reaped $n orphaned VM(s) — a teardown failed for a run that reported green"
            {
              echo "### Reaped $n orphaned VM(s)"
              echo
              echo 'A teardown failed for a run that GitHub reported green.'
              echo
              echo '```'
              cat "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/  /' "$log"
            exit 0
          fi
          echo "no orphans"
