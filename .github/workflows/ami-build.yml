name: Build spill AMI

# Rebuilds the EC2 spill runner AMI from scripts/template-substrate.sh. The AMI
# is tagged substrate-sha=<sha256 of template-substrate.sh>; provision.sh
# refuses to launch an AMI whose tag differs from the substrate at its own ref,
# so every change to the substrate must be followed by this build.
#
# Assumes the AmiBuildRole (infra/terraform/spill.tf), whose trust is pinned to
# this repository's refs/heads/main. Needs the AWS_AMI_BUILD_ROLE_ARN secret
# (stack output AmiBuildRoleArn).

on:
  push:
    branches: [main]
    paths:
      - scripts/template-substrate.sh
      - scripts/ami-build.sh
      - scripts/ami-wait.sh
      - scripts/runner-env.sh
      - nix/flake.nix
      - scripts/guest/start-runner.sh
      - scripts/warm-cache.sh
      - warm/consumers.json
      - .github/workflows/ami-build.yml
  schedule:
    - cron: '17 6 * * 1'   # weekly: picks up the latest base image and runner release
  workflow_dispatch:

# A second build queues rather than cancelling: cancelling mid-build would
# orphan the builder instance and a half-made image.
concurrency:
  group: ami-build
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # retention protects the published v-tags' AMIs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_AMI_BUILD_ROLE_ARN }}
          aws-region: us-west-2

      - name: Build AMI
        run: bash scripts/ami-build.sh
