name: Provision an ephemeral CI runner
description: >-
  Launch a per-run EC2 runner, register it as an org-level self-hosted
  runner in a restricted group, and wait for it to come online. Every CI path
  sets spill: ec2-only; the Proxmox clone path is retained only for legacy
  callers. Outputs the identifiers to tear down and the label to schedule onto.

# WHY THIS IS A COMPOSITE ACTION AND NOT A REUSABLE WORKFLOW
# ---------------------------------------------------------
# Two reasons, either of which decides it on its own.
#
# 1. A reusable workflow ships YAML and nothing else. It never gets its own
#    repository checked out, so provision.sh, teardown.sh and the guest unit
#    could not travel with it -- every consumer would have to vendor the
#    scripts, which is the duplication this repository exists to end. A
#    composite action is handed its own repository at $GITHUB_ACTION_PATH
#    before the first step runs.
#
# 2. A reusable workflow renames the status check. A job that calls one reports
#    as `<caller-job> / <called-job>`, not `<caller-job>`. Both consuming repos
#    have a `pr-required` ruleset requiring a check literally named `test`, and
#    a required check that never reports does not fail the pull request -- it
#    blocks the merge indefinitely with "the base branch policy prohibits the
#    merge" while every job in the run is green. Keeping the orchestration in
#    the caller keeps the job names, and therefore the branch policy, untouched.

inputs:
  ts-oauth-client-id:
    description: Tailscale OAuth client id (tag:ci).
    required: true
  ts-oauth-secret:
    description: Tailscale OAuth secret (tag:ci).
    required: true
  runner-reg-pat:
    description: >-
      PAT with organization "Self-hosted runners: Read and write" AND NOTHING
      ELSE. Not repo Administration -- that also grants repository deletion,
      collaborator management and branch-protection changes, which is far more
      than a CI job should hold on a repo whose required checks are the thing
      stopping unreviewed work from landing.
    required: true
  pve-token-id:
    description: Proxmox API token id (user@realm!tokenname).
    required: true
  pve-token-secret:
    description: Proxmox API token secret, bounded by the pveum ACL to /pool/ephemeral-ci.
    required: true
  pve-api-host:
    description: Proxmox API host (IP or hostname), reachable over the tailnet.
    required: true
  pve-api-hostname:
    description: >-
      Hostname as it appears in the Proxmox TLS certificate. Required when
      pve-api-host is an IP address (the certificate carries no SAN for IPs).
      When set, pvapi.sh connects to pve-api-host but validates TLS against
      this name. Typically the same value as pve-node.
    required: false
    default: ''
  pve-ca-cert:
    description: >-
      Proxmox cluster CA certificate (PEM), used to verify the API TLS
      connection. Supply as a repository or environment variable
      (vars.PVE_CA_CERT). Without this the connection fails loudly — there
      is no insecure fallback.
    required: true
  pve-node:
    description: Proxmox node name.
    required: true
  template-vmid:
    description: VMID of the runner template to clone.
    required: true
  memory-mib:
    description: >-
      Memory in MiB for this consumer's runner VM, applied to the clone before
      it starts; the capacity check requires this much room. Empty uses the
      template's size. Raise it for a consumer whose job does not fit (a Rust
      link plus a headless browser OOMs the 6 GiB template).
    required: false
    default: ''
  cores:
    description: vCPU count for this consumer's runner VM. Empty uses the template's.
    required: false
    default: ''
  instance-type:
    description: >-
      EC2 instance type for a spilled runner, e.g. c7i.4xlarge for 32 GiB.
      Must be in the c7i or c8i families the spill role allows. Empty uses
      c7i.2xlarge. No effect on the Proxmox path.
    required: false
    default: ''
  runner-group:
    description: >-
      Org runner group the guest registers into. The group's repository access
      is what confines an org-level runner to one repository, so this must name
      a group whose selected repositories include the calling repo.
    required: false
    default: ephemeral-ci
  register-timeout-seconds:
    description: How long to wait for the runner to appear in the org runner list.
    required: false
    default: '240'
  node-memory-reserve-mib:
    description: >-
      RAM left for the hypervisor itself -- kernel, ZFS ARC, whatever is not a
      guest. NOT a safety margin for the guests; that is capacity-slack-runners.
      The capacity wait sums maxmem over every running VM on the node, so other
      fleets and production services are already in the total and nobody has to
      declare their sizes here.
    required: false
    default: '8192'
  capacity-slack-runners:
    description: >-
      How many extra runners' worth of room to require before cloning. Two
      provision jobs can observe the same free memory and both clone, and the
      API has no atomic reserve; this bounds that overshoot instead of trying to
      coordinate across GitHub-hosted runners. It costs that many slots of
      standing headroom, which is the price of the guarantee -- and with a Spira
      round VM and its host VM resident, a slack of 1 left no room for any
      runner, so every job waited and spilled to EC2. Defaults to 0 (no slack);
      set 1 to bound the overshoot.
    required: false
    default: '0'
  capacity-timeout-seconds:
    description: >-
      How long to wait for room before giving up. The wait is deliberately long:
      a run that waits is a slow run, and a run that fails for capacity is
      indistinguishable from a broken test to whoever opened the pull request.
      Raised from 1800 so a run queued behind a busy fleet is not failed before
      the fleet can clear (a deckdumpster suite can run longer than 30 minutes).
    required: false
    default: '3600'
  fleet-share-per-repo:
    description: >-
      Maximum concurrent runner VMs allowed from this repository. Counts ALL
      gh-runner VMs tagged with this repo's slug (any state, including stopped
      VMs still being initialised) before cloning; if at or above this ceiling,
      waits. 0 disables, and 0 is the default: each repo counts only itself, so a
      per-repo share cannot enforce fairness across the fleet (2026-09-23).
    required: false
    default: '0'
  spill:
    description: >-
      Every CI path sets "ec2-only": skip the Proxmox attempt entirely and go
      straight to EC2 (law-buy-capacity-rather-than-wait). "ec2" tries Proxmox
      first and spills to EC2 when capacity is exhausted; it is legacy and no
      consumer should use it. Any other value (or absent) disables spill and
      leaves the run on Proxmox, which is not an acceptable default for CI.
    required: false
    default: 'off'
  spill-after-seconds:
    description: >-
      Seconds to wait for Proxmox capacity before spilling to EC2. 0 means
      exhaust the full capacity-timeout-seconds before spilling.
    required: false
    default: '0'
  spill-max-instances:
    description: Maximum concurrent EC2 spill instances allowed.
    required: false
    default: '4'
  aws-role-to-assume:
    description: >-
      IAM role ARN to assume via OIDC before running EC2 spill operations.
      Required when spill=ec2.
    required: false
    default: ''
  spill-ami-id:
    description: >-
      Launch exactly this AMI instead of the newest probe-passed one. Only the
      EC2 spill probe sets it, to test a fresh AMI before promoting it.
    required: false
    default: ''
  spill-market:
    description: >-
      "on-demand" (default) or "spot" for a spilled EC2 runner. Spot can be
      reclaimed mid-job, which fails the job as an ordinary red with no defect
      behind it, so a merge gate must stay on-demand. Set "spot" only for work
      that is safe to retry. No effect on the Proxmox path.
    required: false
    default: 'on-demand'
  spill-root-gib:
    description: >-
      Root volume size in GiB of a spilled EC2 runner. The default matches the
      Proxmox runner's disk so a job that fits there fits on a spill. No effect
      on the Proxmox path.
    required: false
    default: '80'
  spill-tailnet:
    description: >-
      "true" lets an EC2 spill runner join the tailnet as tag:round-vm for the
      length of its job, so a spilled job reaches the caller's warm build cache.
      Uses the Tailscale OAuth client above, whose scopes must include auth_keys
      for tag:round-vm (see the README). Registration waits a bounded time for
      the join and proceeds without it: the `tailnet` output then reads
      "unavailable" and the job runs cold. Has no effect on the Proxmox path.
    required: false
    default: 'true'

outputs:
  vmid:
    description: >-
      The provisioned VM's id, or empty if the clone itself never happened or
      the runner was provisioned on EC2. ALWAYS pass this to the teardown
      action under `if: always()`.
    value: ${{ steps.provision.outputs.vmid }}
  label:
    description: The unique runner label to put in the test job's `runs-on`.
    value: ${{ steps.label.outputs.label }}
  vm-token:
    description: >-
      Ownership token stamped into the VM description at clone time (Proxmox)
      or generated per-run (EC2). Pass this to the teardown action's vm-token
      input so Guard 4b can verify the teardown caller participated in this
      specific provision.
    value: ${{ steps.provision.outputs.vm-token }}
  backend:
    description: >-
      "proxmox" or "ec2", indicating which backend provisioned the runner.
    value: ${{ steps.provision.outputs.backend }}
  instance-id:
    description: >-
      EC2 instance id when backend=ec2, empty otherwise. Pass to teardown
      so it can terminate the instance.
    value: ${{ steps.provision.outputs.instance-id }}
  tailnet:
    description: >-
      "up" or "unavailable" when spill-tailnet was requested and the runner
      landed on EC2; empty otherwise.
    value: ${{ steps.provision.outputs.tailnet }}
  run-record:
    description: >-
      One line of JSON describing this run's runner: backend, instance type,
      vCPUs, market, capacity wait, each refused launch and its reason, boot
      and register seconds. The same record is logged as a line opening with
      its own UTC stamp (`ephemeral-ci-run-record`). Teardown logs the matching
      `ephemeral-ci-run-end`; join on run_id and label.
    value: ${{ steps.register.outputs.run-record || steps.provision.outputs.run-record }}

runs:
  using: composite
  steps:
    # A label unique to this run AND attempt. Never $(hostname): every clone of
    # the template is named ci-runners, GitHub rejects a duplicate runner name,
    # and the caller's test job targets exactly this label -- without uniqueness
    # two concurrent runs can land on each other's VMs and one teardown kills
    # the other's job. github.run_id is unique across all of GitHub, so this is
    # safe with any number of repositories sharing one group. The repository
    # name is in there for legibility on the hypervisor, not for uniqueness.
    - name: Compute runner label
      id: label
      shell: bash
      run: |
        repo='${{ github.event.repository.name }}'
        echo "label=ci-${repo}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

    # Only runs when spill=ec2. The role must carry the permissions defined in
    # SpillStack (ec2:RunInstances, ssm:SendCommand, etc.).
    - name: Configure AWS credentials for EC2 spill
      if: (inputs.spill == 'ec2' || inputs.spill == 'ec2-only') && inputs.aws-role-to-assume != ''
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: us-west-2

    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:ci

    - name: Write CA certificate
      shell: bash
      env:
        PVE_CA_CERT: ${{ inputs.pve-ca-cert }}
      run: |
        printf '%s\n' "$PVE_CA_CERT" > "$RUNNER_TEMP/pve-root-ca.pem"
        echo "PVE_CA_CERT_FILE=$RUNNER_TEMP/pve-root-ca.pem" >> "$GITHUB_ENV"

    # ORG-LEVEL, and the registration URL must match the scope the token was
    # minted for. An org registration token with a repository URL fails at
    # config.sh with a 404 that reads like a bad token.
    - name: Mint a registration token
      id: regtoken
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.runner-reg-pat }}
      run: |
        TOKEN=$(gh api -X POST \
          "orgs/${{ github.repository_owner }}/actions/runners/registration-token" \
          --jq .token)
        echo "::add-mask::$TOKEN"
        echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

    # provision.sh emits vmid= on stdout BEFORE any step that can fail, so the
    # VMID is captured and published even when the script exits non-zero.
    # Without this, a failure after the clone leaks a VM that teardown can never
    # name. See the output contract at the top of scripts/provision.sh.
    - name: Provision the runner VM
      id: provision
      shell: bash
      env:
        PVE_API_HOST: ${{ inputs.pve-api-host }}
        PVE_API_HOSTNAME: ${{ inputs.pve-api-hostname }}
        PVE_NODE: ${{ inputs.pve-node }}
        TEMPLATE_VMID: ${{ inputs.template-vmid }}
        PVE_TOKEN_ID: ${{ inputs.pve-token-id }}
        PVE_TOKEN_SECRET: ${{ inputs.pve-token-secret }}
        RUNNER_GROUP: ${{ inputs.runner-group }}
        RUNNER_MEMORY_MIB: ${{ inputs.memory-mib }}
        RUNNER_CORES: ${{ inputs.cores }}
        SPILL_INSTANCE_TYPE: ${{ inputs.instance-type }}
        NODE_MEM_RESERVE_MIB: ${{ inputs.node-memory-reserve-mib }}
        CAPACITY_SLACK_RUNNERS: ${{ inputs.capacity-slack-runners }}
        CAPACITY_TIMEOUT: ${{ inputs.capacity-timeout-seconds }}
        FLEET_SHARE_PER_REPO: ${{ inputs.fleet-share-per-repo }}
        REPO_SLUG: ${{ github.repository }}
        CRED_FILE: /dev/null
        SPILL: ${{ inputs.spill }}
        SPILL_AFTER_SECONDS: ${{ inputs.spill-after-seconds }}
        SPILL_MAX_INSTANCES: ${{ inputs.spill-max-instances }}
        SPILL_TAILNET: ${{ inputs.spill-tailnet }}
        SPILL_MARKET: ${{ inputs.spill-market }}
        SPILL_ROOT_GIB: ${{ inputs.spill-root-gib }}
        SPILL_AMI_ID: ${{ inputs.spill-ami-id }}
        TS_OAUTH_CLIENT_ID: ${{ inputs.ts-oauth-client-id }}
        TS_OAUTH_SECRET: ${{ inputs.ts-oauth-secret }}
      run: |
        # Each output is published the moment provision.sh prints it, not after
        # it exits: an instance launched by a provision that then fails must
        # still be nameable to teardown (sp-3grl9x). vmid= is written empty
        # first so the EC2 path still exports it; a later real value wins.
        echo "vmid=" >> "$GITHUB_OUTPUT"
        set +e
        bash "${{ github.action_path }}/../scripts/provision.sh" \
                "${{ steps.label.outputs.label }}" \
                "${{ steps.regtoken.outputs.token }}" \
                "${{ github.server_url }}/${{ github.repository_owner }}" \
          | while IFS= read -r line; do
              case "$line" in
                vmid=?*)     echo "$line" >> "$GITHUB_OUTPUT" ;;
                vmtoken=*)   v="${line#vmtoken=}"
                             [ -n "$v" ] && echo "vm-token=$v" >> "$GITHUB_OUTPUT" ;;
                backend=?*)  echo "$line" >> "$GITHUB_OUTPUT" ;;
                instance-id=?*)
                             echo "$line" >> "$GITHUB_OUTPUT"
                             echo "Launched EC2 instance \`${line#instance-id=}\` (teardown terminates it)." >> "$GITHUB_STEP_SUMMARY" ;;
                tailnet=?*)  echo "$line" >> "$GITHUB_OUTPUT" ;;
                run-record=?*) echo "$line" >> "$GITHUB_OUTPUT" ;;
              esac
            done
        RC=${PIPESTATUS[0]}
        set -e
        exit "$RC"

    # WRITING THE FILE IS NOT PROOF OF REGISTRATION. agent/file-write returns
    # success once the bytes land; if the token is bad the guest's service
    # fails, its path unit retriggers until systemd rate-limits it, and the
    # runner never appears -- while this action would otherwise report success
    # and the caller's test job would queue against a label that will never
    # exist, which looks exactly like a label mismatch and is not one.
    #
    # This step also completes the run record (sp-i6qrxk): its elapsed time is
    # the register wait, and the record is logged here, registered or not.
    - name: Wait for the runner to register
      id: register
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.runner-reg-pat }}
        LABEL: ${{ steps.label.outputs.label }}
        TIMEOUT: ${{ inputs.register-timeout-seconds }}
        RUN_RECORD: ${{ steps.provision.outputs.run-record }}
      run: |
        finish() {
          [ -n "$RUN_RECORD" ] || return 0
          bash "${{ github.action_path }}/../scripts/run-record.sh" finish \
            "$RUN_RECORD" "$1" "$2" || true
        }
        started=$SECONDS
        tries=$(( TIMEOUT / 6 ))
        [ "$tries" -gt 0 ] || tries=1
        for _ in $(seq 1 "$tries"); do
          if gh api "orgs/${{ github.repository_owner }}/actions/runners" \
               --paginate --jq '.runners[].name' | grep -qx "$LABEL"; then
            echo "runner $LABEL registered"
            finish $(( SECONDS - started )) ok
            exit 0
          fi
          sleep 6
        done
        echo "::error::runner $LABEL never registered within ${TIMEOUT}s"
        finish - register-timeout
        exit 1

    # Runs only when something above failed, and before teardown destroys the
    # VM. A registration failure is otherwise completely blind: the guest is on
    # an internal bridge with no inbound SSH and the machine is gone seconds
    # later. Never fails the job itself -- the job is already failing and this
    # must not mask the original error.
    - name: Dump guest state on failure
      if: failure() && steps.provision.outputs.vmid != ''
      continue-on-error: true
      shell: bash
      env:
        PVE_API_HOST: ${{ inputs.pve-api-host }}
        PVE_API_HOSTNAME: ${{ inputs.pve-api-hostname }}
        PVE_NODE: ${{ inputs.pve-node }}
        PVE_TOKEN_ID: ${{ inputs.pve-token-id }}
        PVE_TOKEN_SECRET: ${{ inputs.pve-token-secret }}
        CRED_FILE: /dev/null
      run: bash "${{ github.action_path }}/../scripts/guest-diag.sh" "${{ steps.provision.outputs.vmid }}"

    # EC2 counterpart of the step above: collects the runner's own evidence over
    # SSM before the Teardown step terminates the instance.
    - name: Dump EC2 runner state on failure
      if: failure() && steps.provision.outputs.instance-id != ''
      continue-on-error: true
      shell: bash
      run: bash "${{ github.action_path }}/../scripts/ec2-diag.sh" "${{ steps.provision.outputs.instance-id }}"

    # Emit a job summary note when an EC2 instance was launched so the cost
    # is visible in the Actions UI. On-demand c7i.2xlarge in us-west-2 is
    # roughly $0.40/hr; spot is typically half that but is opt-in (spill-market),
    # because a reclaim fails the job as a red.  Teardown must terminate
    # the instance; if teardown is skipped the instance runs until its runner
    # service exits (configured with --ephemeral).
    - name: Note EC2 spill cost
      if: steps.provision.outputs.backend == 'ec2'
      shell: bash
      run: |
        echo "## EC2 spill" >> "$GITHUB_STEP_SUMMARY"
        echo "Runner provisioned on EC2 instance \`${{ steps.provision.outputs.instance-id }}\` (Proxmox capacity was exhausted)." >> "$GITHUB_STEP_SUMMARY"
        if [ -n "${{ steps.provision.outputs.tailnet }}" ]; then
          echo "Tailnet: \`${{ steps.provision.outputs.tailnet }}\` (tag:round-vm)." >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "Market: \`${{ inputs.spill-market || 'on-demand' }}\`." >> "$GITHUB_STEP_SUMMARY"
        echo "Instance type: \`${{ inputs.instance-type || 'c7i.2xlarge' }}\` — ensure teardown terminates it to avoid ongoing cost." >> "$GITHUB_STEP_SUMMARY"
